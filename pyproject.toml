[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "HepGPU"
version = "0.1.0"
description = "3D liver infection simulation in GPU"
authors = [{name="E. Cirujeda, A. Navas-Montilla"}]
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
